# amazon-admin — status / disconnect / sync-now for the main project, reached
# only through the load balancer, and only with an OIDC token from one exact
# identity: amazon-caller@eggcraft-studio.
#
# Placeholders (filled by deploy.sh): PROJECT_ID, PROJECT_NUMBER, IMAGE.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: amazon-admin
  labels:
    boundary: amazon
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/launch-stage: GA
    # Tokens for the public hostname are accepted by Cloud Run's own IAM check
    # (custom audience); the service checks the same value again (ADMIN_AUDIENCE).
    run.googleapis.com/custom-audiences: '["https://amazon.nivadesk.app"]'
spec:
  template:
    metadata:
      labels:
        boundary: amazon
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/network-interfaces: '[{"network":"amazon-vpc","subnetwork":"amazon-subnet"}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      serviceAccountName: amazon-admin@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ROLE
              value: admin
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: REGION
              value: europe-west2
            # The only identity that may call /admin/*, and the audience its
            # token must carry: the public hostname, same as the custom audience above.
            - name: ADMIN_CALLER_EMAIL
              value: amazon-caller@eggcraft-studio.iam.gserviceaccount.com
            - name: ADMIN_AUDIENCE
              value: https://amazon.nivadesk.app
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
            timeoutSeconds: 3
