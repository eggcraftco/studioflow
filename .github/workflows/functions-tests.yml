# CI-002 — the Cloud Functions test tiers, on every push and pull request that
# touches them. Two jobs because they need different things:
#
#   unit      test/qa + test/inventory against the hand-built fake Firestore —
#             no emulator, no Java, seconds.
#   emulator  the Firestore security-rules suites (test/qa/*.test.mjs) and the
#             end-to-end suites (test/e2e) against a real Firestore emulator —
#             the only tier that can catch a document that maps fine and stores
#             badly, or a rule that lets the wrong user write.
#
# The integration tier (test/run-integration.sh) needs Auth + Functions
# emulators and a seed step; it stays local until it is made hermetic.
name: functions-tests

on:
  push:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/functions-tests.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/functions-tests.yml"
  workflow_dispatch:

concurrency:
  group: functions-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (fake Firestore)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  emulator:
    name: rules + e2e (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('.github/workflows/functions-tests.yml') }}
      - run: npm ci
        working-directory: functions
      - run: npm install -g firebase-tools@15
      # A demo- project needs no credentials; the suites pick their own project
      # ids (the emulator is multi-tenant), so this one only names the process.
      - name: Rules + e2e against the emulator
        run: firebase emulators:exec --only firestore --project demo-nivadesk-ci "cd functions && npm run test:rules && bash test/run-e2e.sh"
        env:
          CI: "true"
