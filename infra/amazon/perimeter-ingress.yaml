# VPC-SC ingress rules for the amazon_information perimeter.
# Rendered by perimeter.sh: PROJECT_NUMBER, MAIN_PROJECT_NUMBER, OPERATOR_EMAIL, PROJECT_ID.
#
# 1. The operator, from anywhere, to every restricted service: console and
#    gcloud work from the audited human account and from nothing else.
- ingressFrom:
    identities:
      - user:OPERATOR_EMAIL
    sources:
      - accessLevel: "*"
  ingressTo:
    operations:
      - serviceName: "*"
    resources:
      - "*"
# 2. HTTP invocations of the project's Cloud Run services — /admin/* through
#    the load balancer from amazon-caller@, and Cloud Scheduler's tick. VPC-SC
#    evaluates these as run.googleapis.com/HttpIngress WITHOUT the caller's IAM
#    identity (Cloud Run docs: "ingress policy rules that use IAM principals are
#    not supported. Only the ANY_IDENTITY identity type is supported"), so the
#    rule cannot name the caller. The API accepts neither a method selector
#    "HttpIngress" nor a permission selector for run.googleapis.com, so the
#    selector is "*": VPC-SC admits any identity to the run API of this
#    project; every call is still checked by Cloud Run IAM (invoker and
#    management roles), Cloud Armor and the services' own OIDC verification.
#    Seen in dry-run 2026-09-05 03:51 as NO_MATCHING_ACCESS_LEVEL before this rule.
- ingressFrom:
    identityType: ANY_IDENTITY
    sources:
      - accessLevel: "*"
  ingressTo:
    operations:
      - serviceName: run.googleapis.com
        methodSelectors:
          - method: "*"
    resources:
      - projects/PROJECT_NUMBER
# 3. Security Command Center's notification service agent (organisation-level,
#    Google-managed) publishes each finding into the project's scc-findings
#    topic — a Pub/Sub call from outside the perimeter. Without this rule the
#    finding exists but never reaches the operator.
- ingressFrom:
    identities:
      - serviceAccount:service-org-378239481010@gcp-sa-scc-notification.iam.gserviceaccount.com
    sources:
      - accessLevel: "*"
  ingressTo:
    operations:
      - serviceName: pubsub.googleapis.com
        methodSelectors:
          - method: "*"
    resources:
      - projects/PROJECT_NUMBER
# 4. Deploys and builds. `gcloud run … replace/create` and Cloud Build read
#    this project's Artifact Registry (image manifests, pushes) and the build
#    staging bucket from Google-managed infrastructure, as amazon-deploy@ —
#    the perimeter sees that as ingress. Dry-run 2026-09-05 12:38:54:
#    artifactregistry.googleapis.com/DockerRead by amazon-deploy@,
#    NO_MATCHING_ACCESS_LEVEL. Enforcing without this rule would break every
#    deploy. One identity, two services, this project only.
- ingressFrom:
    identities:
      - serviceAccount:amazon-deploy@PROJECT_ID.iam.gserviceaccount.com
    sources:
      - accessLevel: "*"
  ingressTo:
    operations:
      - serviceName: artifactregistry.googleapis.com
        methodSelectors:
          - method: "*"
      - serviceName: storage.googleapis.com
        methodSelectors:
          - method: "*"
    resources:
      - projects/PROJECT_NUMBER
