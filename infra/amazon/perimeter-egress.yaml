# VPC-SC egress rules for the amazon_information perimeter.
# Rendered by perimeter.sh: PROJECT_NUMBER, MAIN_PROJECT_NUMBER, PROJECT_ID.
#
# 1. The one door out: amazon-sync@ may invoke Cloud Run in the main project —
#    that is ingestAmazonEnvelope, and the payload is the allowlisted envelope.
- egressFrom:
    identities:
      - serviceAccount:amazon-sync@PROJECT_ID.iam.gserviceaccount.com
  egressTo:
    operations:
      - serviceName: run.googleapis.com
        methodSelectors:
          - method: "*"
    resources:
      - projects/MAIN_PROJECT_NUMBER
# (The earlier "amazon-deploy@ → Artifact Registry / Storage inside the
#  project" rule was mis-shaped: a build or a deploy reading this project's
#  registry from Google's side is INGRESS, and the dry-run showed it as such
#  on 2026-09-05 — see rule 4 of perimeter-ingress.yaml.)
